#********************************************************************************
# This file contains user specific environment variables.
# You may reconfigure some variables to tweak devonfw-ide to your personal needs.
# However, you do so at your own risk!!!
# Only change variables if you know exactly what you are doing!!!
# For details see:
# https://github.com/devonfw/IDEasy/blob/main/documentation/configuration.adoc#configuration
#********************************************************************************

# Uncomment the following line to use your shared maven repository.
# This will save diskspace but comes with the risk that other projects could
# accidentally (or due to an security attack) access and use artifacts from this project.
# If you are working in a project that is highly sensitive never use this feature.
#export M2_REPO=~/.m2/repository

# In case you are sitting behind a proxy these JVM options may help:
#export JAVA_OPTS=-Dhttp.proxyHost=myproxy.com -Dhttp.proxyPort=8080

# Uncomment if you always want to clone via ssh instead of HTTPS
#PREFERRED_GIT_PROTOCOL=ssh

# Your GitHub login. IDEasy uses this to clone your fork of devonfw/IDEasy
# (see setup.adoc, "Set up the code repository for contributing").
# If your GitHub login is the same as your Capgemini/OS username you can reference the
# OS user variable instead of hard-coding your name. This properties file resolves IDEasy
# variables (${VAR} / $[VAR]) from the environment, and USER is set on Windows too:
#GITHUB_USER=${USER}
# ...or just hard-code your GitHub login if it differs from your OS username:
#GITHUB_USER=«your-github-login»

# If you are responsible for the IDEasy settings in your project, you might want to uncomment
# the following line to get more attention to misconfigurations
#FAIL_ON_AMBIGOUS_MERGE=true

# If you have crazy VPN tools interfering and causing errors on downloads you may try this workaround.
# However, downgrading to older HTTP versions can be a security problem so only use this when absolutely neccessary.
#HTTP_VERSIONS=HTTP_2, HTTP_1_1

#ECLIPSE_VMARGS=-Xms128M -Xmx768M
